<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080908">
<title>Explore · FICTION CLUB</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="manifest" href="./site.webmanifest">
<link rel="stylesheet" href="./assets/app-ui.css">
<style>
:root{color-scheme:dark;--lime:#d7ff32;--muted:#9da493}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#343f20 0,#171b12 38%,#080908 78%);color:#f5f6ef;font:15px/1.45 Inter,system-ui,sans-serif}
main{width:min(100% - 32px,760px);margin:0 auto;padding:28px 0 48px}
header{display:flex;align-items:center;gap:12px;padding:5px 0 34px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--lime);color:#15190b;display:grid;place-items:center;font-weight:950;font-size:21px}
.brand-name{font-size:14px;font-weight:850;letter-spacing:.12em}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
h1{font-size:clamp(30px,7vw,42px);letter-spacing:-.055em;margin:0}
.intro{color:var(--muted);font-size:13px;margin:7px 0 25px}
.group-title{font-size:11px;color:#aab19c;text-transform:uppercase;letter-spacing:.14em;font-weight:800;margin:0 0 12px}
.explore-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{min-height:132px;display:flex;flex-direction:column;justify-content:space-between;padding:17px;border-radius:19px;border:1px solid #30372a;background:linear-gradient(145deg,#1b2017,#10120e);color:inherit;text-decoration:none;transition:border-color .18s,transform .18s}
.item:active{transform:scale(.985)}
.item:hover{border-color:#788b3c}
.item-top{display:flex;align-items:center;justify-content:space-between}
.icon{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:#2b3520;color:var(--lime);font-size:19px}
.arrow{color:#9ca58b;font-size:18px}
.item strong{font-size:14px;font-weight:800}
.item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
footer{border-top:1px solid #262b22;margin-top:27px;padding-top:16px;color:#727a68;font-size:10px;letter-spacing:.04em}
@media(max-width:380px){main{width:calc(100% - 24px)}.explore-list{gap:9px}.item{padding:14px;min-height:124px}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand-mark">F</div>
  <div><div class="brand-name">FICTION CLUB</div><div class="brand-sub">Your digital finance space</div></div>
</header>
<section aria-labelledby="page-title">
  <h1 id="page-title">Explore</h1>
  <p class="intro">Choose a service to get started.</p>
  <h2 class="group-title">Services</h2>
  <nav class="explore-list" aria-label="Explore services">
    <a class="item" href="./recharge-mvp.html"><span class="item-top"><span class="icon">ϟ</span><span class="arrow">↗</span></span><span><strong>Recharge</strong><small>Mobile and DTH recharge</small></span></a>
    <a class="item" href="./bill-payments.html"><span class="item-top"><span class="icon">▤</span><span class="arrow">↗</span></span><span><strong>Bill Payments</strong><small>Electricity, water and more</small></span></a>
    <a class="item" href="./credit-cards.html"><span class="item-top"><span class="icon">▣</span><span class="arrow">↗</span></span><span><strong>Credit Cards</strong><small>Explore card options</small></span></a>
    <a class="item" href="./gromo-links.html"><span class="item-top"><span class="icon">◫</span><span class="arrow">↗</span></span><span><strong>Loans & Finance</strong><small>Financial product listings</small></span></a>
  </nav>
</section>
<footer>FICTION CLUB · DEMO</footer>
</main>
</body>
</html>
